spec:
  versionName: '26.08.23'
  upgradeDescription: |
    v26.08.23: vLLM upgrade to stable v0.27.1-cu129 (SHA-pinned) — Gemma-4 ViT
    CUDA graph (#46837), JIT warmup (#47451/#49903), SM120/121 kernel fix
    (#49904), torch 2.13. KV cache: fp8 + --kv-cache-dtype-skip-layers
    sliding_window (SWA layers stay BF16). triton_attn kept — FlashInfer still
    unsupported on SM120 for Gemma-4 vision (#40677). Built for Olares 1.12.6.
  fullDescription: |
    Gemma 4 26B A4B – Multimodal LLM (Text + Image) with QAT-AWQ-INT4 quantization on vLLM.

    **Modell**
    cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 (QAT + AWQ INT4, ~16 GB).
    200K Token Kontext. Multimodal (Text + Image, kein Video).

    **Inference Engine**
    vLLM v0.27.1 stable cu129, SHA-pinned (v0.27.1-cu129) with triton_attn backend. CUDA 12.9 (RTX 5090 Blackwell).
    fp8 KV-Cache (sliding-window layers kept BF16 via --kv-cache-dtype-skip-layers). CUDAGraphs + torch.compile.
    Native hybrid SWA: 5 full-attention layers for long context, 25 sliding-window layers bounded.
    GPU VRAM: ~22.5 GB.

    **Performance (RTX 5090 Blackwell)**
    - Short (50 tok): ~133 tok/s
    - Medium (500 tok): ~106 tok/s
    - Long (2000 tok): ~100+ tok/s
    - Vision: ~129 tok/s

    **API**
    OpenAI-kompatibel: /v1/chat/completions, /v1/models, /health.
    Tool Calling via --enable-auto-tool-choice + --tool-call-parser gemma4.
    Reasoning via --reasoning-parser gemma4 + --default-chat-template-kwargs enable_thinking.

    **Resource Usage**
    GPU: ~22.5 GB VRAM belegt (RTX 5090, 24 GB total)
    RAM: 24-40 GB
    Disk: 50 GB (Model-Download ~15 GB + Cache)
    CPU: 4-16 Kerne

  developer: Aimighty
