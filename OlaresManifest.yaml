envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
options:
  apiTimeout: 3600
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
  allowMultipleInstall: false
