spec:
  versionName: '26.08.20'
  upgradeDescription: |
    v26.08.20: Unified naming — title "AIM Gemma 4 26B A4B" (engine suffix removed),
    categories AI + Vision, English descriptions. Built for Olares 1.12.6.
  fullDescription: |
    Gemma 4 26B A4B – Multimodales LLM (Text + Image) mit QAT-AWQ-INT4 Quantisierung auf vLLM.

    **Modell**
    cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 (QAT + AWQ INT4, ~16 GB).
    200K Token Kontext. Multimodal (Text + Image, kein Video).

    **Inference Engine**
    vLLM v0.23.1rc (cu129, SHA-gepinnt) mit triton_attn Backend. CUDA 12.9 (RTX 5090 Blackwell).
    fp8 KV-Cache. GPU VRAM: ~22.5 GB belegt.

    **Performance (RTX 5090 Blackwell)**
    - Short (50 tok): ~133 tok/s
    - Medium (500 tok): ~106 tok/s
    - Long (2000 tok): ~100+ tok/s
    - Vision: ~129 tok/s

    **API**
    OpenAI-kompatibel: /v1/chat/completions, /v1/models, /health.
    Tool Calling via --enable-auto-tool-choice + --tool-call-parser gemma4.
    Reasoning via --reasoning-parser gemma4 + --default-chat-template-kwargs enable_thinking.

    **Resource Usage**
    GPU: ~22.5 GB VRAM belegt (RTX 5090, 24 GB total)
    RAM: 24-40 GB
    Disk: 50 GB (Model-Download ~15 GB + Cache)
    CPU: 4-16 Kerne

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmgemma4vllm
  sourceCode: https://github.com/bayerhazard/aimighty-llmgemma4vllm
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: 4
  requiredMemory: 24Gi
  limitedCpu: 16
  limitedMemory: 40Gi
  requiredDisk: 50Gi
  requiredGpu: 1
permission:
