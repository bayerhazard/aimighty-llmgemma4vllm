spec:
  versionName: '26.9.1'
  upgradeDescription: |
    v26.9.1: vLLM-Update Stable v0.28.0-cu129 -> Stable v0.29.0-cu129
    (MRv2-Default #53183, CUDA-Graph-Memory #53306, Parser-Fixes #54089/#54218).
    Identische Leistung, 200K-Kontext. Built for Olares 1.12.6.
    Wechsel von 26.08.X (Altformat) auf 26.9.1: einmalig uninstall + install.
  fullDescription: |
    Gemma 4 26B A4B – Multimodal LLM (Text + Image) with QAT-AWQ-INT4 quantization on vLLM.

    **Modell**
    cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 (QAT + AWQ INT4, ~16 GB).
    200K Token Kontext. Multimodal (Text + Image, kein Video).

    **Inference Engine**
    vLLM stable v0.29.0-cu129 with triton_attn backend. CUDA 12.9 (RTX 5090 Blackwell).
    fp8 KV-Cache (all layers). CUDAGraphs + torch.compile.
    Native hybrid SWA: 5 full-attention layers for long context, 25 sliding-window layers bounded.
    GPU VRAM: ~22.5 GB.

    **Performance (RTX 5090 Blackwell)**
    - 200K Token Kontext
    - ~137 tok/s Generation (2000 tok)
    - Needle Haystack: 25/25 (100%, inkl. 131K/190K)
    - Tool-Calling: 9/9 (100%)

    **API**
    OpenAI-kompatibel: /v1/chat/completions, /v1/models, /health.
    Tool Calling via --enable-auto-tool-choice + --tool-call-parser gemma4.
    Reasoning via --reasoning-parser gemma4 + --default-chat-template-kwargs enable_thinking.

    **Resource Usage**
    GPU: ~22.5 GB VRAM belegt (RTX 5090, 24 GB total)
    RAM: 24-40 GB
    Disk: 50 GB (Model-Download ~15 GB + Cache)
    CPU: 4-16 Kerne

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmgemma4vllm
  sourceCode: https://github.com/bayerhazard/aimighty-llmgemma4vllm
  locale:
    - en-US
  supportArch:
