name: Build KVarN v0.23 Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bayerhazard/aimighty-embedder
  TAG: vllm-kvarn-0.23

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout KVarN fork
        uses: actions/checkout@v4
        with:
          repository: huawei-csl/KVarN
          ref: main
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            CUDA_VERSION=12.9.2
            max_jobs=2
            nvcc_threads=4
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=kvarn
          cache-to: type=gha,mode=max,scope=kvarn
          platforms: linux/amd64
          progress: plain
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp
          retention-days: 7
