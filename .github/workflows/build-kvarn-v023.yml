name: Build KVarN v0.23 Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bayerhazard/aimighty-embedder
  TAG: vllm-kvarn-0.23
  TARGET: ghcr.io/bayerhazard/aimighty-llmgemma4vllm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo (chart + Dockerfile.kvarn)
        uses: actions/checkout@v4

      - name: Checkout KVarN fork (context)
        uses: actions/checkout@v4
        with:
          repository: huawei-csl/KVarN
          ref: main
          fetch-depth: 1
          path: kvarn

      - name: Move Dockerfile + fork into build context
        run: |
          mkdir -p build/opt/KVarN
          cp Dockerfile.kvarn build/Dockerfile
          cp -r kvarn/. build/opt/KVarN/
          rm -rf build/opt/KVarN/.git
          ls build/opt/KVarN | head -5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          file: build/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.TARGET }}:${{ env.TAG }}
          cache-from: type=gha,scope=kvarn-overlay
          cache-to: type=gha,mode=max,scope=kvarn-overlay
          platforms: linux/amd64
          progress: plain
