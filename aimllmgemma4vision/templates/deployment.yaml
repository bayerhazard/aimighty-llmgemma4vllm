apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-26b-nvfp4-vision
  namespace: {{ .Release.Namespace }}
  labels:
    app: gemma4-26b-nvfp4-vision
    applications.app.bytetrade.io/name: aimllmgemma4vision
    applications.app.bytetrade.io/owner: aimighty
    applications.app.bytetrade.io/raw-app-name: aimllmgemma4vision
  annotations:
    applications.app.bytetrade.io/entrances: '[{"name":"gemma4-26b-nvfp4-vision","host":"gemma4-26b-nvfp4-vision","port":8000,"icon":"https://raw.githubusercontent.com/bayerhazard/aimighty-llmgemma4vllm/main/icon.png","title":"Gemma 4 Vision","authLevel":"internal","openMethod":"window"}]'
    applications.app.bytetrade.io/gpu-inject: "true"
    applications.app.bytetrade.io/icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmgemma4vllm/main/icon.png
    applications.app.bytetrade.io/ports: '[]'
    applications.app.bytetrade.io/required_gpu: 1Gi
    applications.app.bytetrade.io/source: market
    applications.app.bytetrade.io/tailscale: '{}'
    applications.app.bytetrade.io/title: AIM Gemma 4 26B Vision
    applications.app.bytetrade.io/version: "1.0.4"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: gemma4-26b-nvfp4-vision
  template:
    metadata:
      labels:
        app: gemma4-26b-nvfp4-vision
        applications.app.bytetrade.io/name: aimllmgemma4vision
        applications.app.bytetrade.io/owner: {{ .Release.Namespace | trimSuffix "-aimighty" }}
        applications.app.bytetrade.io/raw-app-name: aimllmgemma4vision
        io.bytetrade.app: "true"
    spec:
      runtimeClassName: nvidia
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      containers:
      - name: gemma4-26b-nvfp4-vision
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - vllm
        - serve
        args:
        - "$(MODEL_NAME)"
        - --served-model-name
        - "$(MODEL_ALIAS)"
        - --host
        - 0.0.0.0
        - --port
        - {{ .Values.apiPort | quote }}
        - --max-model-len
        - "$(MAX_MODEL_LEN)"
        - --gpu-memory-utilization
        - "$(GPU_MEMORY_UTILIZATION)"
        - --max-num-seqs
        - "$(MAX_NUM_SEQS)"
        - --max-num-batched-tokens
        - "$(MAX_NUM_BATCHED_TOKENS)"
        - --dtype
        - auto
        - --trust-remote-code
        - --download-dir
        - /models
        - --kv-cache-dtype
        - {{ .Values.vllmArgs.kvCacheDtype }}
        - --enable-prefix-caching
        - --enable-auto-tool-choice
        - --tool-call-parser
        - gemma4
        - --reasoning-parser
        - gemma4
        - --moe-backend
        - {{ .Values.vllmArgs.moeBackend }}
        env:
        - name: HF_HOME
          value: {{ .Values.env.HF_HOME }}
        - name: VLLM_ATTENTION_BACKEND
          value: {{ .Values.env.VLLM_ATTENTION_BACKEND }}
        - name: GPU_TYPE
          value: {{ .Values.env.GPU_TYPE }}
        envFrom:
        - configMapRef:
            name: gemma4-26b-nvfp4-vision-env
        ports:
        - containerPort: {{ .Values.apiPort }}
          protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.volumes.models.mountPath }}
          name: models
        - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/gemma4.py
          name: gemma4-patch
          subPath: gemma4.py
        - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/layer.py
          name: fused-moe-patch
          subPath: layer.py
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
      volumes:
      - hostPath:
          path: "{{ .Values.userspace.appData }}/gemma4-26b-nvfp4-vision/models"
          type: DirectoryOrCreate
        name: models
      - configMap:
          name: gemma4-26b-nvfp4-vision-gemma4-patch
        name: gemma4-patch
      - configMap:
          name: gemma4-26b-nvfp4-vision-fused-moe-patch
        name: fused-moe-patch
