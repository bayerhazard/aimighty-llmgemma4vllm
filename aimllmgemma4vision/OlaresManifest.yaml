  upgradeDescription: |
    v1.0.2: Force Olares re-sync after chart was stuck in render-failed state.
    v1.0.1: Version bump to force Olares re-sync after initial release.
    v1.0.0: Initial release. Gemma 4 26B A4B Vision NVFP4 on vLLM via Olares Market.
  fullDescription: |
    Gemma 4 26B A4B Vision – Multimodales LLM (Text + Image) mit NVFP4-Quantisierung auf vLLM V1 + Marlin MoE Backend.

    **Modell**
    google/gemma-4-26B-A4B-it (MoE, 25.2B total / 3.8B active per token).
    Quantisiert von bg-digitalservices auf NVFP4 (NVIDIA 4-bit Weights + Activations, W4A4, ~15 GB).
    97.6% Qualitätsretention vs BF16 (gemessen: GSM8K, IFEval).
    256K Token Kontext. Multimodal (Text + Image).

    **Inference Engine**
    vLLM V1 + Marlin MoE Backend. CUDA 13.1 (RTX 5090 Blackwell SM12.0).
    fp8_e4m3 KV-Cache. GPU VRAM: ~22.6 GB belegt, ~1.8 GB frei.

    **Performance**
    - Short (100 tok): 40 tok/s
    - Medium (500 tok): 103 tok/s
    - Long (2000 tok): 126 tok/s
    - Vision (200 tok): 129 tok/s
    - Optional EAGLE-3 Speculator: ~55-148 tok/s (nicht mit Multimodal kompatibel)

    **Patches**
    Zwei vLLM-Patches als ConfigMaps eingebaut:
    - gemma4.py: NVFP4 Scale-Key-Mapping für MoE
    - fused_moe_layer.py: reduce_results-Parameter-Kompatibilität

    **API**
    OpenAI-kompatibel: /v1/chat/completions, /v1/models, /health.
    Vision via base64 data URIs im Chat-Completions-Request.

