spec:
  versionName: '26.9.1'
  upgradeDescription: |
    v26.9.1: vLLM-Update Stable v0.28.0-cu129 -> Stable v0.29.0-cu129 (MRv2 ist
    jetzt Default fuer alle Modelle, #53183; CUDA-Graph-Memory-Reservation #53306;
    Parser-Fixes #54089/#54218; Spec-Decode-Verbesserungen #48915/#52242).
    Identische Leistung wie v0.28.0 (136.6 tok/s, Needle 25/25, Tool 9/9,
    200K-Kontext, KV-Pool 236.049). MTP bleibt deaktiviert (VRAM-Overhead:
    max. 50.4K Kontext bei 0.96). GPU_UTIL 0.96. Built for Olares 1.12.6.
    Hinweis: Wechsel von 26.08.X (Altformat) auf 26.9.1 erfordert einmalig
    uninstall + install.
  fullDescription: |
    Gemma 4 26B A4B — multimodal LLM (text + image) with QAT-AWQ-INT4 quantization on vLLM.

    **Model**
    cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 (QAT + AWQ INT4, ~16 GB).
    200K token context. Multimodal (text + image, no video).

    **Inference Engine**
    vLLM stable v0.29.0-cu129 with triton_attn backend. CUDA 12.9 (RTX 5090 Blackwell).
    fp8 KV-Cache (all layers). CUDAGraphs + torch.compile.
    Native hybrid SWA: 5 full-attention layers for long context, 25 sliding-window layers bounded.
    GPU VRAM: ~22.5 GB.

    **Performance (RTX 5090 Blackwell)**
    - 200K token context
    - ~137 tok/s generation
    - Needle Haystack: 25/25 (100%, incl. 131K/190K)
    - Agentic Tool-Calling: 9/9 (100%)

    **API**
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health.
    Tool Calling via --enable-auto-tool-choice + --tool-call-parser gemma4.
    Reasoning via --reasoning-parser gemma4 + --default-chat-template-kwargs enable_thinking.

    **Resource Usage**
    GPU: ~22.5 GB VRAM (RTX 5090, 24 GB)
    RAM: 24-40 GB
    Disk: 50 GB (model download ~16 GB + cache)
    CPU: 4-16 cores

  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmgemma4vllm
  sourceCode: https://github.com/bayerhazard/aimighty-llmgemma4vllm
