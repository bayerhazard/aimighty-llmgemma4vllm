spec:
  versionName: '2.0.5'
  upgradeDescription: |
    v2.0.5: Reduce MAX_MODEL_LEN 200000→147500 (KV cache OOM fix with sliding_window skip layers).
    v2.0.4: Bump GPU_MEMORY_UTILIZATION 0.975→0.985.
    v2.0.3: Force re-sync (hash collision fix).
    v2.0.2: Added --kv-cache-dtype-skip-layers sliding_window (FP16 for sliding-window layers) + --calculate-kv-scales (dynamic FP8 KV scale calibration) + --kv-offloading-size 24GiB (CPU swap for long-context preemption) + --quantization compressed-tensors (explicit). Renamed to "AIM Gemma4 26B-A4B vLLM".
    v2.0.0: Complete restructure. Renamed to aimllmgemma4vllm. Switched from bg-digitalservices/Gemma-4-26B-A4B-it-NVFP4 to cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 with MTP speculative decoding. New image vllm/vllm-openai:v0.23.0. Added triton_attn backend, fp8 KV cache, gemma4 tool calling. Removed NVFP4 patches (gemma4.py, fused_moe_layer.py). Follows vLLM Qwen36 chart conventions.
  fullDescription: |
    Gemma 4 26B A4B – Multimodales LLM (Text + Image) mit QAT-AWQ-INT4 Quantisierung und MTP Speculative Decoding auf vLLM.

    **Modell**
    cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4 (QAT + AWQ INT4, ~15 GB).
    MTP Speculative Decoding mit google/gemma-4-26B-A4B-it-assistant (3 spekulative Tokens).
    200K Token Kontext. Multimodal (Text + Image).

    **Inference Engine**
    vLLM v0.23.0 mit triton_attn Backend. CUDA 13.1 (RTX 5090 Blackwell SM12.0).
    fp8 KV-Cache. GPU VRAM: ~22.5 GB belegt.

    **Performance (RTX 5090 Blackwell)**
    - Short (50 tok): ~133 tok/s
    - Medium (500 tok): ~106 tok/s
    - Long (2000 tok): ~100+ tok/s
    - Vision: ~129 tok/s

    **API**
    OpenAI-kompatibel: /v1/chat/completions, /v1/models, /health.
    Tool Calling via --enable-auto-tool-choice + --tool-call-parser gemma4.
    Reasoning via --reasoning-parser gemma4 + --default-chat-template-kwargs enable_thinking.

    **Resource Usage**
    GPU: ~22.5 GB VRAM belegt (RTX 5090, 24 GB total)
    RAM: 24-40 GB
    Disk: 50 GB (Model-Download ~15 GB + Cache)
    CPU: 4-16 Kerne

