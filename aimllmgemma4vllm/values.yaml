replicaCount: 1

workloads:
  aimllmgemma4vllm:
    replicaCount: 1

# Olares-injected env (from OlaresManifest envs:). Default present so
# standalone `helm template` renders without nil pointer; Olares overrides at install.
olaresEnv:
  HF_TOKEN: ""

image:
  repository: vllm/vllm-openai
  # SHA-pinned nightly = exakt der verifizierte Build (v0.23.1rc1.dev1403+g4080263bb).
  # Enthaelt PR #40708 (weight_packed KeyError Fix). gemma4/gemma4-0505-cu130 crashen.
  tag: cu129-nightly-4080263bb2c5d10deac17aaeb88e0823bc35bca9
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: aimllmgemma4vllm

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 16
    memory: 40Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1

env:
  MODEL_NAME: cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
  MODEL_ALIAS: gemma-4-26b-vllm
  # 96000: MTP + CUDAGraphs + fp8 KV + Blackwell 24 GB = 102k token pool bei 2.74 GiB.
  # 200k crasht mit MTP (V1 Engine braucht 28 KiB/Tok vs V0 14 KiB, kein V0-Fallback).
  MAX_MODEL_LEN: "96000"
  GPU_MEMORY_UTILIZATION: "0.98"
  MAX_NUM_SEQS: "2"
  # 8192: Encoder-Cache-Budget = max_num_batched_tokens → halbiert MM-Profiling-Speicher.
  MAX_NUM_BATCHED_TOKENS: "8192"
  NUM_SPEC_TOKENS: "3"
  DRAFTER_NAME: google/gemma-4-26B-A4B-it-assistant
  VLLM_EXTRA_ARGS: --generation-config vllm

runtimeClassName: ""

probes:
  startup:
    path: /health
    port: 8000
    failureThreshold: 120
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 30
  liveness:
    path: /health
    port: 8000
    failureThreshold: 5
    periodSeconds: 30
    initialDelaySeconds: 600
    timeoutSeconds: 10

userspace:
  appData: /olares/rootfs/userspace/pvc-userspace-aimighty-hh1h3chfhnoebc1y
