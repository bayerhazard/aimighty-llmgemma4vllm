replicaCount: 1

workloads:
  aimllmgemma4vllm:
    replicaCount: 1

# Olares-injected env (from OlaresManifest envs:). Default present so
# standalone `helm template` renders without nil pointer; Olares overrides at install.
olaresEnv:
  HF_TOKEN: ""

image:
  repository: vllm/vllm-openai
  # Stable v0.27.1 (cu129) — SHA-pinned per Release-Tag. Gemma-4 ViT CUDA
  # Graph (#46837), JIT-Warmup (#47451/#49903), SM120/121-Kernel-Fix (#49904),
  # torch 2.13. PR #40708 (weight_packed) + MM-bidir (#40534) enthalten.
  tag: v0.27.1-cu129
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: aimllmgemma4vllm

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 16
    memory: 40Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1

env:
  MODEL_NAME: cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
  MODEL_ALIAS: gemma-4-26b-vllm
  # 200000: Ziel-Langkontext. Hybride SWA-Amortisation (5 Full-Attn-Layer zahlen
  # Langkontext (~10 KB/Tok fp8, V1), 25 Sliding-Layer window 1024 amortisieren).
  # Skip-layers: Sliding-Window-Layer bleiben BF16 (bounded, fast kein Zusatz-VRAM),
  # Full-Attn-Layer fp8 (empfohlen fuer hybride Modelle).
  # V1-Bedarf ~28 KiB/Tok-Äquivalent (Full-Attn-Anteil) → Pool-Ziel ~267k Tokens.
  MAX_MODEL_LEN: "200000"
  GPU_MEMORY_UTILIZATION: "0.98"
  MAX_NUM_SEQS: "2"
  # 8192: Encoder-Cache-Budget = max_num_batched_tokens → halbiert MM-Profiling-Speicher.
  MAX_NUM_BATCHED_TOKENS: "8192"
  VLLM_EXTRA_ARGS: --generation-config vllm

runtimeClassName: ""

probes:
  startup:
    path: /health
    port: 8000
    failureThreshold: 120
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 30
  liveness:
    path: /health
    port: 8000
    failureThreshold: 5
    periodSeconds: 30
    initialDelaySeconds: 600
    timeoutSeconds: 10

userspace:
  appData: /olares/rootfs/userspace/pvc-userspace-aimighty-hh1h3chfhnoebc1y
