replicaCount: 1

workloads:
  aimllmgemma4vllm:
    replicaCount: 1

# Olares-injected env (from OlaresManifest envs:). Default present so
# standalone `helm template` renders without nil pointer; Olares overrides at install.
olaresEnv:
  HF_TOKEN: ""

image:
  repository: vllm/vllm-openai
  # SHA-pinned nightly = exakt der verifizierte Build (v0.23.1rc1.dev1403+g4080263bb).
  # Enthaelt PR #40708 (weight_packed KeyError Fix). gemma4/gemma4-0505-cu130 crashen.
  tag: cu129-nightly-4080263bb2c5d10deac17aaeb88e0823bc35bca9
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: aimllmgemma4vllm

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 16
    memory: 40Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1

env:
  MODEL_NAME: cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
  MODEL_ALIAS: gemma-4-26b-vllm
  # 200000: funktioniert dank hybrider SWA-Amortisation — nur die 5 Full-Attention-Layer
  # zahlen Langkontext (~10 KB/Tok fp8), die 25 Sliding-Layer (window 1024) amortisieren sich.
  # Pool bei 200k: 267k Tokens (4.77 GiB). VORAUSSETZUNG: video:0 + batch 8192 + util 0.98,
  # sonst frisst der MM-Encoder-Cache 3.5 GiB und 200k crasht ("5.13 GiB needed > 2.52 GiB").
  MAX_MODEL_LEN: "200000"
  GPU_MEMORY_UTILIZATION: "0.98"
  MAX_NUM_SEQS: "2"
  # 8192: Encoder-Cache-Budget = max_num_batched_tokens → halbiert MM-Profiling-Speicher.
  MAX_NUM_BATCHED_TOKENS: "8192"
  # DRAFTER_NAME and NUM_SPEC_TOKENS removed — gemma4 tag's transformers is too old for assistant model
  VLLM_EXTRA_ARGS: --generation-config vllm

runtimeClassName: ""

probes:
  startup:
    path: /health
    port: 8000
    failureThreshold: 120
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 30
  liveness:
    path: /health
    port: 8000
    failureThreshold: 5
    periodSeconds: 30
    initialDelaySeconds: 600
    timeoutSeconds: 10

userspace:
  appData: /olares/rootfs/userspace/pvc-userspace-aimighty-hh1h3chfhnoebc1y
