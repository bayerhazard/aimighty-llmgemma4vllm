replicaCount: 1

workloads:
  aimllmgemma4vllm:
    replicaCount: 1

# Olares-injected env (from OlaresManifest envs:). Default present so
# standalone `helm template` renders without nil pointer; Olares overrides at install.
olaresEnv:
  HF_TOKEN: ""

image:
  repository: vllm/vllm-openai
  # v0.27.1-cu129 (Stable) ist fuer Gemma 4 DEFEKT: wurde mit unbounded
  # transformers gebaut, das 1 Tag spaeter erschienene 5.15.0 bricht das
  # Gemma-4-Config-Parsing (AmbiguousGlobalPerLayerAttributeError, #51744).
  # Fix vLLM PR #49797 (merged 10.08.) erst in main/nightly.
  # => Nightly 2026-08-14 SHA-pinned (enthaelt #49797 + torch 2.13).
  tag: cu129-nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: aimllmgemma4vllm

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 16
    memory: 40Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1

env:
  MODEL_NAME: cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
  MODEL_ALIAS: gemma-4-26b-vllm
  # MTP-Experiment (26.08.26/27): Draft google/gemma-4-26B-A4B-it-assistant kostet
  # ~2 GiB VRAM => KV-Budget 4.69 -> 2.66 GiB. 200K fp8 braucht 3.57 GiB (est. max
  # 104224). Kompromiss fuer Perf-Test: max_model_len 100000 (KV-Bedarf ~1.79 GiB,
  # passt). MTP-Pfad laeuft jetzt (kein mat-shape-Fehler, #47091/#48892 im Nightly).
  # Hybride SWA: 5 Full-Attn-Layer zahlen Langkontext, 25 Sliding window 1024.
  MAX_MODEL_LEN: "100000"
  GPU_MEMORY_UTILIZATION: "0.98"
  MAX_NUM_SEQS: "2"
  # 8192: Encoder-Cache-Budget = max_num_batched_tokens → halbiert MM-Profiling-Speicher.
  MAX_NUM_BATCHED_TOKENS: "8192"
  VLLM_EXTRA_ARGS: --generation-config vllm

runtimeClassName: ""

probes:
  startup:
    path: /health
    port: 8000
    failureThreshold: 120
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 30
  liveness:
    path: /health
    port: 8000
    failureThreshold: 5
    periodSeconds: 30
    initialDelaySeconds: 600
    timeoutSeconds: 10

userspace:
  appData: /olares/rootfs/userspace/pvc-userspace-aimighty-hh1h3chfhnoebc1y
